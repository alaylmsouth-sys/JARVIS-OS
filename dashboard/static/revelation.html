<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요한계시록</title>
<style>
  :root{
    --bg:#f3efe6; --card:#fffdf9; --line:#e8e2d6;
    --green:#2d6a4f; --green-dark:#245741; --green-soft:#eef5ef; --green-line:#d3e3d7;
    --ink:#3b3a36; --sub:#8a857a; --gold:#c19a2e;
    --orange:#d95f45; --orange-bg:#fdf1ec; --orange-line:#f2c6b8;
    --lav:#efeafc; --lav-ink:#6b5bb5;
    --red:#c0392b; --red-bg:#fdf0ee;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; padding:24px 16px 80px;}
  .wrap{max-width:1120px; margin:0 auto;}
  h1.title{font-family:'Noto Serif KR','Nanum Myeongjo',Batang,serif; font-weight:700; font-size:30px; text-align:center; color:#2f2a3a; padding:10px 0 26px; border-bottom:1px solid var(--line); margin-bottom:28px; letter-spacing:1px;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:16px; box-shadow:0 1px 2px rgba(60,50,30,.04);}
  .seg{display:flex; gap:4px; background:#edeade; border-radius:12px; padding:4px;}
  .seg .tabbtn{flex:1;}
  .tabbtn{appearance:none; border:none; background:transparent; border-radius:9px; padding:9px 16px; font-size:15px; cursor:pointer; color:#6d675a; font-family:inherit; font-weight:500; white-space:nowrap; transition:background .18s, color .18s, box-shadow .18s;}
  .tabbtn:hover{color:var(--ink);}
  .tabbtn.on{background:#fff; color:var(--green-dark); font-weight:700; box-shadow:0 1px 4px rgba(60,50,30,.12);}
  .tabbtn.on:hover{background:#fff;}

  .optbar{display:flex; align-items:center; flex-wrap:wrap; justify-content:space-evenly; gap:8px 14px; margin-top:10px; padding:8px 6px 2px; border-top:1px solid var(--line);}
  .optbar label{display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer; user-select:none;}
  .optbar input[type=checkbox]{width:16px; height:16px; accent-color:var(--green); cursor:pointer;}
  .optbar .spacer{flex:1;}

  .quarters{display:flex; flex-wrap:wrap; gap:6px; margin:20px 0 10px;}
  .qbtn{background:transparent; border:1px solid transparent; border-radius:99px; padding:7px 15px; font-size:14px; cursor:pointer; font-family:inherit; color:var(--sub); font-weight:500; transition:background .15s, color .15s;}
  .qbtn:hover{color:var(--ink); background:#f1eee4;}
  .qbtn.on{background:var(--green); color:#fff; font-weight:700;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px;}
  .chip{background:#fff; border:1px solid var(--line); border-radius:99px; padding:8px 16px; font-size:15px; cursor:pointer; font-family:inherit; color:var(--ink); transition:background .15s, color .15s, border-color .15s;}
  .chip:hover{border-color:#cfc9ba;}
  .chip.on{background:var(--green); border-color:var(--green); color:#fff; font-weight:700;}

  .chapcard{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 28px 34px; box-shadow:0 1px 3px rgba(60,50,30,.05);}
  .chaptitle{font-family:'Noto Serif KR','Nanum Myeongjo',Batang,serif; font-size:27px; font-weight:700; color:#22483a; margin-bottom:5px;}
  .chapsub{color:var(--sub); font-size:15px; margin-bottom:8px;}

  .section{width:fit-content; max-width:100%; background:#f1efe9; border-left:4px solid var(--green); border-radius:6px; padding:7px 14px; font-weight:700; font-size:14.5px; margin:26px 0 6px;}
  .vnum{font-weight:700; font-size:16px; color:#2f2a3a; white-space:nowrap; flex-shrink:0;}
  .vrow{display:flex; align-items:center; gap:10px; margin:22px 0 8px;}
  .memo{flex:1; min-width:0; max-width:420px; border:1px solid var(--line); background:#fffdf9; border-radius:8px; padding:7px 11px; font-size:14px; font-family:inherit; color:var(--ink); transition:border-color .15s, box-shadow .15s;}
  .memo::placeholder{color:#bcb6a8;}
  .memo:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 2px var(--green-soft);}
  .memo.has{border-color:var(--gold); background:#fffaf0;}
  .vtext{background:var(--green-soft); border:1px solid var(--green-line); border-radius:10px; padding:14px 16px; font-size:16.5px; line-height:1.85; word-break:keep-all; white-space:pre-wrap;}
  .vtext.blurred{filter:blur(6px); cursor:pointer;}
  .vtext.reveal-hint{cursor:pointer;}
  textarea.ans{width:100%; min-height:96px; margin-top:10px; background:#faf7f0; border:1px solid var(--line); border-radius:10px; padding:13px 15px; font-size:16px; line-height:1.8; font-family:inherit; resize:vertical; color:var(--ink);}
  textarea.ans:focus{outline:2px solid var(--green-line);}
  textarea.ans:disabled{opacity:.75;}
  .checkbtn{margin-top:10px; background:var(--green); color:#fff; border:none; border-radius:99px; padding:11px 26px; font-size:15.5px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s, box-shadow .15s, transform .15s;}
  .checkbtn:hover{background:var(--green-dark); box-shadow:0 3px 10px rgba(45,106,79,.25); transform:translateY(-1px);}
  .checkbtn:active{transform:translateY(0); box-shadow:none;}
  .bigcheck{display:block; width:100%; margin-top:30px; padding:15px; font-size:17px; border-radius:14px;}
  .retrybtn{margin-top:10px; margin-left:8px; background:#fff; border:1px solid var(--line); color:var(--sub); border-radius:99px; padding:10px 20px; font-size:14.5px; cursor:pointer; font-family:inherit; transition:background .15s, color .15s;}
  .retrybtn:hover{background:#f6f2e9; color:var(--ink);}

  .result{margin-top:10px; border-radius:10px; padding:12px 15px; font-size:15.5px; line-height:1.8; word-break:keep-all;}
  .result.ok{background:var(--green-soft); border:1px solid var(--green-line); color:var(--green-dark); font-weight:700;}
  .result.bad{background:var(--red-bg); border:1px solid #f0ccc5;}
  .result.bad .tag{color:var(--red); font-weight:700;}
  .result .cmp{margin-top:6px;}
  .result .cmp b{color:var(--red); background:#fbdcd6; border-radius:4px; padding:0 2px;}
  .result .lbl{color:var(--sub); font-size:13.5px; margin-top:8px;}

  .blankline{background:var(--green-soft); border:1px solid var(--green-line); border-radius:10px; padding:14px 16px; font-size:16.5px; line-height:2.4; word-break:keep-all;}
  input.blank{border:none; border-bottom:2px solid var(--green); background:#fff; border-radius:6px 6px 0 0; padding:3px 6px; font-size:16px; font-family:inherit; text-align:center; margin:0 2px; color:var(--ink);}
  input.blank:focus{outline:none; background:#f2f8f3;}
  input.blank.okb{background:var(--green-soft); border-bottom-color:var(--green); color:var(--green-dark); font-weight:700;}
  input.blank.badb{background:var(--red-bg); border-bottom-color:var(--red); color:var(--red);}

  .examref{background:#f1efe9; border:1px dashed #cfc9ba; border-radius:10px; padding:14px 16px; font-size:15.5px; color:#6d675a;}

  .empty{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:60px 20px; text-align:center; color:var(--sub); font-size:16px;}
  .wrongitem{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 24px; margin-bottom:16px;}
  .wrongitem .ref{font-weight:700; font-size:16.5px; margin-bottom:4px;}
  .wrongitem .meta{color:var(--sub); font-size:13.5px; margin-bottom:12px;}
  .wrongitem .myans{background:var(--red-bg); border:1px solid #f0ccc5; border-radius:10px; padding:12px 14px; font-size:15.5px; line-height:1.8; margin-bottom:8px; word-break:keep-all;}
  .rmbtn{background:none; border:none; color:var(--sub); font-size:13.5px; cursor:pointer; text-decoration:underline; margin-left:10px; font-family:inherit;}
  .studyhint{color:var(--sub); font-size:13.5px; margin:14px 0 0;}
  .toolrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; align-items:center;}
  .toolbtn{background:#fff; border:1px solid var(--line); border-radius:99px; padding:8px 16px; font-size:14px; cursor:pointer; font-family:inherit; color:var(--ink); transition:background .15s, border-color .15s;}
  .toolbtn:hover{background:#f6f2e9; border-color:#cfc9ba;}
  .toolbtn.on{background:var(--green); border-color:var(--green); color:#fff; font-weight:700;}
  .toolbtn.on:hover{background:var(--green-dark);}
  /* 본문 교정 기능 */
  .editrow{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-top:16px;}
  .edithint{color:var(--sub); font-size:13.5px; line-height:1.6;}
  .edithint b{color:var(--green-dark);}
  .editbox{margin-bottom:6px;}
  .editbtns{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .editbtns .checkbtn,.editbtns .retrybtn,.editbtns .toolbtn{margin-top:0;}
  .editta{margin-top:8px; min-height:120px;}
  .corrbadge{display:inline-block; vertical-align:middle; margin-left:8px; background:var(--orange-bg); color:var(--orange); border:1px solid var(--orange-line); border-radius:99px; padding:2px 10px; font-size:12px; font-weight:700;}
  .revertbtn{color:var(--orange); border-color:var(--orange-line);}
  .revertbtn:hover{background:var(--orange-bg); border-color:var(--orange);}
  .scrollnav{position:fixed; right:14px; bottom:26px; display:flex; flex-direction:row; gap:8px; z-index:50;}
  .scrollnav button{width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:rgba(255,253,249,.95); color:var(--ink); font-size:17px; cursor:pointer; font-family:inherit; box-shadow:0 2px 8px rgba(60,50,30,.18); transition:background .15s, color .15s, border-color .15s;}
  .scrollnav button:hover{background:var(--green); border-color:var(--green); color:#fff;}
  .scrollnav .navreset{color:var(--orange); border-color:var(--orange-line); font-size:19px;}
  .scrollnav .navreset:hover{background:var(--orange); border-color:var(--orange); color:#fff;}

  @media(max-width:640px){
    .chapcard{padding:20px 16px 26px;}
    .optbar{gap:10px 12px;}
    h1.title{font-size:24px;}
    .seg .tabbtn{padding:9px 4px; font-size:14px;}
    .scrollnav{right:10px; bottom:18px;}
    .scrollnav button{width:38px; height:38px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">요한계시록</h1>

  <div class="panel" id="controlPanel">
    <div class="seg" id="modePanel">
      <button class="tabbtn" id="mode-copy" onclick="setMode('copy')">✏️ 따라쓰기</button>
      <button class="tabbtn" id="mode-exam" onclick="setMode('exam')">📝 모의고사</button>
      <button class="tabbtn" id="mode-blank" onclick="setMode('blank')">🧩 빈칸채우기</button>
      <button class="tabbtn" id="mode-study" onclick="setMode('study')">📘 학습 모드</button>
    </div>
    <div class="optbar">
        <label><input type="checkbox" id="opt-strict" onchange="setOpt()"> 띄어쓰기까지 정확히</label>
        <label><input type="checkbox" id="opt-shuffle" onchange="setOpt()"> 절 순서 무작위</label>
        <label><input type="checkbox" id="opt-reverse" onchange="setOpt()"> 절 순서 거꾸로</label>
      <label><input type="checkbox" id="opt-chgrade" onchange="setOpt()"> 장별 채점</label>
    </div>
  </div>

  <div class="quarters" id="quarters"></div>
  <div class="chips" id="chips"></div>

  <div id="content"></div>
</div>

<div class="scrollnav">
  <button class="navreset" onclick="resetChapter()" title="이 장 초기화" aria-label="이 장 초기화">↺</button>
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})" title="맨 위로" aria-label="맨 위로">▲</button>
  <button onclick="window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})" title="맨 아래로" aria-label="맨 아래로">▼</button>
</div>

<script>
const BIBLE = {
1:["예수 그리스도의 계시라 이는 하나님이 그에게 주사 반드시 속히 될 일을 그 종들에게 보이시려고 그 천사를 그 종 요한에게 보내어 지시하신 것이라","요한은 하나님의 말씀과 예수 그리스도의 증거 곧 자기의 본 것을 다 증거하였느니라","이 예언의 말씀을 읽는 자와 듣는 자들과 그 가운데 기록한 것을 지키는 자들이 복이 있나니 때가 가까움이라","요한은 아시아에 있는 일곱 교회에 편지하노니 이제도 계시고 전에도 계시고 장차 오실 이와 그 보좌 앞에 일곱 영과","또 충성된 증인으로 죽은 자들 가운데서 먼저 나시고 땅의 임금들의 머리가 되신 예수 그리스도로 말미암아 은혜와 평강이 너희에게 있기를 원하노라 우리를 사랑하사 그의 피로 우리 죄에서 우리를 해방하시고","그 아버지 하나님을 위하여 우리를 나라와 제사장으로 삼으신 그에게 영광과 능력이 세세토록 있기를 원하노라 아멘","볼지어다 구름을 타고 오시리라 각인의 눈이 그를 보겠고 그를 찌른 자들도 볼 터이요 땅에 있는 모든 족속이 그를 인하여 애곡하리니 그러하리라 아멘","주 하나님이 가라사대 나는 알파와 오메가라 이제도 있고 전에도 있었고 장차 올 자요 전능한 자라 하시더라","나 요한은 너희 형제요 예수의 환난과 나라와 참음에 동참하는 자라 하나님의 말씀과 예수의 증거를 인하여 밧모라 하는 섬에 있었더니","주의 날에 내가 성령에 감동하여 내 뒤에서 나는 나팔소리 같은 큰 음성을 들으니","가로되 너 보는 것을 책에 써서 에베소, 서머나, 버가모, 두아디라, 사데, 빌라델비아, 라오디게아 일곱 교회에 보내라 하시기로","몸을 돌이켜 나더러 말한 음성을 알아 보려고 하여 돌이킬 때에 일곱 금 촛대를 보았는데","촛대 사이에 인자 같은 이가 발에 끌리는 옷을 입고 가슴에 금띠를 띠고","그 머리와 털의 희기가 흰 양털 같고 눈 같으며 그의 눈은 불꽃 같고","그의 발은 풀무에 단련한 빛난 주석 같고 그의 음성은 많은 물소리와 같으며","그 오른손에 일곱 별이 있고 그 입에서 좌우에 날선 검이 나오고 그의 얼굴은 해가 힘있게 비취는 것 같더라","내가 볼 때에 그 발 앞에 엎드러져 죽은 자 같이 되매 그가 오른손을 내게 얹고 가라사대 두려워 말라 나는 처음이요 나중이니","곧 산 자라 내가 전에 죽었었노라 볼지어다 이제 세세토록 살아 있어 사망과 음부의 열쇠를 가졌노니","그러므로 네 본 것과 이제 있는 일과 장차 될 일을 기록하라","네 본 것은 내 오른손에 보인 일곱 별의 비밀과 일곱 금 촛대라 일곱 별은 일곱 교회의 사자요 일곱 촛대는 일곱 교회니라"],

3:["사데 교회의 사자에게 편지하기를 하나님의 일곱 영과 일곱 별을 가진 이가 가라사대 내가 네 행위를 아노니 네가 살았다 하는 이름은 가졌으나 죽은 자로다","너는 일깨워 그 남은 바 죽게 된 것을 굳게 하라 내 하나님 앞에 네 행위의 온전한 것을 찾지 못하였노니","그러므로 네가 어떻게 받았으며 어떻게 들었는지 생각하고 지키어 회개하라 만일 일깨지 아니하면 내가 도적 같이 이르리니 어느 시에 네게 임할는지 네가 알지 못하리라","그러나 사데에 그 옷을 더럽히지 아니한 자 몇 명이 네게 있어 흰 옷을 입고 나와 함께 다니리니 그들은 합당한 자인 연고라","이기는 자는 이와 같이 흰 옷을 입을 것이요 내가 그 이름을 생명책에서 반드시 흐리지 아니하고 그 이름을 내 아버지 앞과 그 천사들 앞에서 시인하리라","귀 있는 자는 성령이 교회들에게 하시는 말씀을 들을지어다","빌라델비아 교회의 사자에게 편지하기를 거룩하고 진실하사 다윗의 열쇠를 가지신 이 곧 열면 닫을 사람이 없고 닫으면 열 사람이 없는 그이가 가라사대","볼지어다 내가 네 앞에 열린 문을 두었으되 능히 닫을 사람이 없으리라 내가 네 행위를 아노니 네가 적은 능력을 가지고도 내 말을 지키며 내 이름을 배반치 아니하였도다","보라 사단의 회 곧 자칭 유대인이라 하나 그렇지 않고 거짓말 하는 자들 중에서 몇을 네게 주어 저희로 와서 네 발 앞에 절하게 하고 내가 너를 사랑하는 줄을 알게 하리라","네가 나의 인내의 말씀을 지켰은즉 내가 또한 너를 지키어 시험의 때를 면하게 하리니 이는 장차 온 세상에 임하여 땅에 거하는 자들을 시험할 때라","내가 속히 임하리니 네가 가진 것을 굳게 잡아 아무나 네 면류관을 빼앗지 못하게 하라","이기는 자는 내 하나님 성전에 기둥이 되게 하리니 그가 결코 다시 나가지 아니하리라 내가 하나님의 이름과 하나님의 성 곧 하늘에서 내 하나님께로부터 내려오는 새 예루살렘의 이름과 나의 새 이름을 그이 위에 기록하리라","귀 있는 자는 성령이 교회들에게 하시는 말씀을 들을지어다","라오디게아 교회의 사자에게 편지하기를 아멘이시요 충성되고 참된 증인이시요 하나님의 창조의 근본이신 이가 가라사대","내가 네 행위를 아노니 네가 차지도 아니하고 더웁지도 아니하도다 네가 차든지 더웁든지 하기를 원하노라","네가 이같이 미지근하여 더웁지도 아니하고 차지도 아니하니 내 입에서 너를 토하여 내치리라","네가 말하기를 나는 부자라 부요하여 부족한 것이 없다 하나 네 곤고한 것과 가련한 것과 가난한 것과 눈 먼 것과 벌거벗은 것을 알지 못하도다","내가 너를 권하노니 내게서 불로 연단한 금을 사서 부요하게 하고 흰 옷을 사서 입어 벌거벗은 수치를 보이지 않게 하고 안약을 사서 눈에 발라 보게 하라","무릇 내가 사랑하는 자를 책망하여 징계하노니 그러므로 네가 열심을 내라 회개하라","볼지어다 내가 문 밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그로 더불어 먹고 그는 나로 더불어 먹으리라","이기는 그에게는 내가 내 보좌에 함께 앉게 하여 주기를 내가 이기고 아버지 보좌에 함께 앉은 것과 같이 하리라","귀 있는 자는 성령이 교회들에게 하시는 말씀을 들을지어다"],
4:["이 일 후에 내가 보니 하늘에 열린 문이 있는데 내가 들은 바 처음에 내게 말하던 나팔소리 같은 그 음성이 가로되 이리로 올라오라 이 후에 마땅히 될 일을 내가 네게 보이리라 하시더라","내가 곧 성령에 감동하였더니 보라 하늘에 보좌를 베풀었고 그 보좌 위에 앉으신 이가 있는데","앉으신 이의 모양이 벽옥과 홍보석 같고 또 무지개가 있어 보좌에 둘렸는데 그 모양이 녹보석 같더라","또 보좌에 둘려 이십 사 보좌들이 있고 그 보좌들 위에 이십 사 장로들이 흰 옷을 입고 머리에 금 면류관을 쓰고 앉았더라","보좌로부터 번개와 음성과 뇌성이 나고 보좌 앞에 일곱 등불 켠 것이 있으니 이는 하나님의 일곱 영이라","보좌 앞에 수정과 같은 유리 바다가 있고 보좌 가운데와 보좌 주위에 네 생물이 있는데 앞 뒤에 눈이 가득하더라","그 첫째 생물은 사자 같고 그 둘째 생물은 송아지 같고 그 세째 생물은 얼굴이 사람 같고 그 네째 생물은 날아가는 독수리 같은데","네 생물이 각각 여섯 날개가 있고 그 안과 주위에 눈이 가득하더라 그들이 밤낮 쉬지 않고 이르기를 거룩하다 거룩하다 거룩하다 주 하나님 곧 전능하신 이여 전에도 계셨고 이제도 계시고 장차 오실 자라 하고","그 생물들이 영광과 존귀와 감사를 보좌에 앉으사 세세토록 사시는 이에게 돌릴 때에","이십 사 장로들이 보좌에 앉으신 이 앞에 엎드려 세세토록 사시는 이에게 경배하고 자기의 면류관을 보좌 앞에 던지며 가로되","우리 주 하나님이여 영광과 존귀와 능력을 받으시는 것이 합당하오니 주께서 만물을 지으신지라 만물이 주의 뜻대로 있었고 또 지으심을 받았나이다 하더라"],
5:["내가 보매 보좌에 앉으신 이의 오른손에 책이 있으니 안팎으로 썼고 일곱 인으로 봉하였더라","또 보매 힘 있는 천사가 큰 음성으로 외치기를 누가 책을 펴며 그 인을 떼기에 합당하냐 하니","하늘 위에나 땅 위에나 땅 아래에 능히 책을 펴거나 보거나 할 이가 없더라","이 책을 펴거나 보거나 하기에 합당한 자가 보이지 않기로 내가 크게 울었더니","장로 중에 하나가 내게 말하되 울지 말라 유대 지파의 사자 다윗의 뿌리가 이기었으니 이 책과 그 일곱 인을 떼시리라 하더라","내가 또 보니 보좌와 네 생물과 장로들 사이에 어린 양이 섰는데 일찍 죽임을 당한 것 같더라 일곱 뿔과 일곱 눈이 있으니 이 눈은 온 땅에 보내심을 입은 하나님의 일곱 영이더라","어린 양이 나아와서 보좌에 앉으신 이의 오른손에서 책을 취하시니라","책을 취하시매 네 생물과 이십 사 장로들이 어린 양 앞에 엎드려 각각 거문고와 향이 가득한 금대접을 가졌으니 이 향은 성도의 기도들이라","새 노래를 노래하여 가로되 책을 가지시고 그 인봉을 떼기에 합당하시도다 일찍 죽임을 당하사 각 족속과 방언과 백성과 나라 가운데서 사람들을 피로 사서 하나님께 드리시고","저희로 우리 하나님 앞에서 나라와 제사장을 삼으셨으니 저희가 땅에서 왕노릇하리로다 하더라","내가 또 보고 들으매 보좌와 생물들과 장로들을 둘러 선 많은 천사의 음성이 있으니 그 수가 만만이요 천천이라","큰 음성으로 가로되 죽임을 당하신 어린 양이 능력과 부와 지혜와 힘과 존귀와 영광과 찬송을 받으시기에 합당하도다 하더라","내가 또 들으니 하늘 위에와 땅 위에와 땅 아래와 바다 위에와 또 그 가운데 모든 만물이 가로되 보좌에 앉으신 이와 어린 양에게 찬송과 존귀와 영광과 능력을 세세토록 돌릴지어다 하니","네 생물이 가로되 아멘 하고 장로들은 엎드려 경배하더라"],
6:["내가 보매 어린 양이 일곱 인 중에 하나를 떼시는 그 때에 내가 들으니 네 생물 중에 하나가 우뢰 소리 같이 말하되 오라 하기로","내가 이에 보니 흰 말이 있는데 그 탄 자가 활을 가졌고 면류관을 받고 나가서 이기고 또 이기려고 하더라","둘째 인을 떼실 때에 내가 들으니 둘째 생물이 말하되 오라 하더니","이에 붉은 다른 말이 나오더라 그 탄 자가 허락을 받아 땅에서 화평을 제하여 버리며 서로 죽이게 하고 또 큰 칼을 받았더라","세째 인을 떼실 때에 내가 들으니 세째 생물이 말하되 오라 하기로 내가 보니 검은 말이 나오는데 그 탄 자가 손에 저울을 가졌더라","내가 네 생물 사이로서 나는 듯하는 음성을 들으니 가로되 한 데나리온에 밀 한 되요 한 데나리온에 보리 석 되로다 또 감람유와 포도주는 해치 말라 하더라","네째 인을 떼실 때에 내가 네째 생물의 음성을 들으니 가로되 오라 하기로","내가 보매 청황색 말이 나오는데 그 탄 자의 이름은 사망이니 음부가 그 뒤를 따르더라 저희가 땅 사분 일의 권세를 얻어 검과 흉년과 사망과 땅의 짐승으로써 죽이더라","다섯째 인을 떼실 때에 내가 보니 하나님의 말씀과 저희의 가진 증거를 인하여 죽임을 당한 영혼들이 제단 아래 있어","큰 소리로 불러 가로되 거룩하고 참되신 대주재여 땅에 거하는 자들을 심판하여 우리 피를 신원하여 주지 아니하시기를 어느 때까지 하시려나이까 하니","각각 저희에게 흰 두루마기를 주시며 가라사대 아직 잠시 동안 쉬되 저희 동무 종들과 형제들도 자기처럼 죽임을 받아 그 수가 차기까지 하라 하시더라","내가 보니 여섯째 인을 떼실 때에 큰 지진이 나며 해가 총담 같이 검어지고 온 달이 피 같이 되며","하늘의 별들이 무화과나무가 대풍에 흔들려 선 과실이 떨어지는 것 같이 땅에 떨어지며","하늘은 종이 축이 말리는 것 같이 떠나가고 각 산과 섬이 제 자리에서 옮기우매","땅의 임금들과 왕족들과 장군들과 부자들과 강한 자들과 각 종과 자주자가 굴과 산 바위 틈에 숨어","산과 바위에게 이르되 우리 위에 떨어져 보좌에 앉으신 이의 낯에서와 어린 양의 진노에서 우리를 가리우라","그들의 진노의 큰 날이 이르렀으니 누가 능히 서리요 하더라"],
7:["이 일 후에 내가 네 천사가 땅 네 모퉁이에 선 것을 보니 땅의 사방의 바람을 붙잡아 바람으로 하여금 땅에나 바다에나 각종 나무에 불지 못하게 하더라","또 보매 다른 천사가 살아계신 하나님의 인을 가지고 해 돋는 데로부터 올라와서 땅과 바다를 해롭게 할 권세를 얻은 네 천사를 향하여 큰 소리로 외쳐","가로되 우리가 우리 하나님의 종들의 이마에 인치기까지 땅이나 바다나 나무나 해하지 말라 하더라","내가 인 맞은 자의 수를 들으니 이스라엘 자손의 각 지파 중에서 인 맞은 자들이 십 사만 사천이니","유다 지파 중에 인 맞은 자가 일만 이천이요 르우벤 지파 중에 일만 이천이요 갓 지파 중에 일만 이천이요","아셀 지파 중에 일만 이천이요 납달리 지파 중에 일만 이천이요 므낫세 지파 중에 일만 이천이요","시므온 지파 중에 일만 이천이요 레위 지파 중에 일만 이천이요 잇사갈 지파 중에 일만 이천이요","스불론 지파 중에 일만 이천이요 요셉 지파 중에 일만 이천이요 베냐민 지파 중에 인 맞은 자가 일만 이천이라","이 일 후에 내가 보니 각 나라와 족속과 백성과 방언에서 아무라도 능히 셀 수 없는 큰 무리가 흰 옷을 입고 손에 종려 가지를 들고 보좌 앞과 어린 양 앞에 서서","큰 소리로 외쳐 가로되 구원하심이 보좌에 앉으신 우리 하나님과 어린 양에게 있도다 하니","모든 천사가 보좌와 장로들과 네 생물의 주위에 섰다가 보좌 앞에 엎드려 얼굴을 대고 하나님께 경배하여","가로되 아멘 찬송과 영광과 지혜와 감사와 존귀와 능력과 힘이 우리 하나님께 세세토록 있을지로다 아멘 하더라","장로 중에 하나가 응답하여 내게 이르되 이 흰 옷 입은 자들이 누구며 또 어디서 왔느뇨","내가 가로되 내 주여 당신이 알리이다 하니 그가 나더러 이르되 이는 큰 환난에서 나오는 자들인데 어린 양의 피에 그 옷을 씻어 희게 하였느니라","그러므로 그들이 하나님의 보좌 앞에 있고 또 그의 성전에서 밤낮 하나님을 섬기매 보좌에 앉으신 이가 그들 위에 장막을 치시리니","저희가 다시 주리지도 아니하며 목마르지도 아니하고 해나 아무 뜨거운 기운에 상하지 아니할지니","이는 보좌 가운데 계신 어린 양이 저희의 목자가 되사 생명수 샘으로 인도하시고 하나님께서 저희 눈에서 모든 눈물을 씻어 주실 것임이러라"],
8:["일곱째 인을 떼실 때에 하늘이 반시 동안쯤 고요하더니","내가 보매 하나님 앞에 시위한 일곱 천사가 있어 일곱 나팔을 받았더라","또 다른 천사가 와서 제단 곁에 서서 금 향로를 가지고 많은 향을 받았으니 이는 모든 성도의 기도들과 합하여 보좌 앞 금단에 드리고자 함이라","향연이 성도의 기도와 함께 천사의 손으로부터 하나님 앞으로 올라가는지라","천사가 향로를 가지고 단 위의 불을 담아다가 땅에 쏟으매 뇌성과 음성과 번개와 지진이 나더라","일곱 나팔 가진 일곱 천사가 나팔 불기를 예비하더라","첫째 천사가 나팔을 부니 피 섞인 우박과 불이 나서 땅에 쏟아지매 땅의 삼분의 일이 타서 사위고 수목의 삼분의 일도 타서 사위고 각종 푸른 풀도 타서 사위더라","둘째 천사가 나팔을 부니 불붙는 큰 산과 같은 것이 바다에 던지우매 바다의 삼분의 일이 피가 되고","바다 가운데 생명 가진 피조물들의 삼분의 일이 죽고 배들의 삼분의 일이 깨어지더라","세째 천사가 나팔을 부니 횃불 같이 타는 큰 별이 하늘에서 떨어져 강들의 삼분의 일과 여러 물샘에 떨어지니","이 별 이름은 쑥이라 물들의 삼분의 일이 쑥이 되매 그 물들이 쓰게 됨을 인하여 많은 사람이 죽더라","네째 천사가 나팔을 부니 해 삼분의 일과 달 삼분의 일과 별들의 삼분의 일이 침을 받아 그 삼분의 일이 어두워지니 낮 삼분의 일은 비췸이 없고 밤도 그러하더라","내가 또 보고 들으니 공중에 날아가는 독수리가 큰 소리로 이르되 땅에 거하는 자들에게 화, 화, 화가 있으리로다 이 외에도 세 천사의 불 나팔 소리를 인함이로다 하더라"],
9:["다섯째 천사가 나팔을 불매 내가 보니 하늘에서 땅에 떨어진 별 하나가 있는데 저가 무저갱의 열쇠를 받았더라","저가 무저갱을 여니 그 구멍에서 큰 풀무의 연기 같은 연기가 올라오매 해와 공기가 그 구멍의 연기로 인하여 어두워지며","또 황충이 연기 가운데로부터 땅 위에 나오매 저희가 땅에 있는 전갈의 권세와 같은 권세를 받았더라","저희에게 이르시되 땅의 풀이나 푸른 것이나 각종 수목은 해하지 말고 오직 이마에 하나님의 인 맞지 아니한 사람들만 해하라 하시더라","그러나 그들을 죽이지는 못하게 하시고 다섯 달 동안 괴롭게만 하게 하시는데 그 괴롭게 함은 전갈이 사람을 쏠 때에 괴롭게 함과 같더라","그 날에는 사람들이 죽기를 구하여도 얻지 못하고 죽고 싶으나 죽음이 저희를 피하리로다","황충들의 모양은 전쟁을 위하여 예비한 말들 같고 그 머리에 금 같은 면류관 비슷한 것을 썼으며 그 얼굴은 사람의 얼굴 같고","또 여자의 머리털 같은 머리털이 있고 그 이는 사자의 이 같으며","또 철흉갑 같은 흉갑이 있고 그 날개들의 소리는 병거와 많은 말들이 전장으로 달려 들어가는 소리 같으며","또 전갈과 같은 꼬리와 쏘는 살이 있어 그 꼬리에는 다섯 달 동안 사람들을 해하는 권세가 있더라","저희에게 임금이 있으니 무저갱의 사자라 히브리 음으로 이름은 아바돈이요 헬라 음으로 이름은 아볼루온이더라","첫째 화는 지나갔으나 보라 아직도 이 후에 화 둘이 이르리로다","여섯째 천사가 나팔을 불매 내가 들으니 하나님 앞 금단 네 뿔에서 한 음성이 나서","나팔 가진 여섯째 천사에게 말하기를 큰 강 유브라데에 결박한 네 천사를 놓아 주라 하매","네 천사가 놓였으니 그들은 그 년 월 일 시에 이르러 사람 삼분의 일을 죽이기로 예비한 자들이더라","마병대의 수는 이만만이니 내가 그들의 수를 들었노라","이같이 이상한 가운데 그 말들과 그 탄 자들을 보니 불빛과 자주빛과 유황빛 흉갑이 있고 또 말들의 머리는 사자 머리 같고 그 입에서는 불과 연기와 유황이 나오더라","이 세 재앙 곧 저희 입에서 나오는 불과 연기와 유황을 인하여 사람 삼분의 일이 죽임을 당하니라","이 말들의 힘은 그 입과 그 꼬리에 있으니 그 꼬리는 뱀 같고 또 꼬리에 머리가 있어 이것으로 해하더라","이 재앙에 죽지 않고 남은 사람들은 그 손으로 행하는 일을 회개치 아니하고 오히려 여러 귀신과 또는 보거나 듣거나 다니거나 하지 못하는 금, 은, 동과 목석의 우상에게 절하고","또 그 살인과 복술과 음행과 도적질을 회개치 아니하더라"],
10:["내가 또 보니 힘 센 다른 천사가 구름을 입고 하늘에서 내려오는데 그 머리 위에 무지개가 있고 그 얼굴은 해 같고 그 발은 불기둥 같으며","그 손에 펴놓인 작은 책을 들고 그 오른발은 바다를 밟고 왼발은 땅을 밟고","사자의 부르짖는 것 같이 큰 소리로 외치니 외칠 때에 일곱 우뢰가 그 소리를 발하더라","일곱 우뢰가 발할 때에 내가 기록하려고 하다가 곧 들으니 하늘에서 소리나서 말하기를 일곱 우뢰가 발한 것을 인봉하고 기록하지 말라 하더라","내가 본 바 바다와 땅을 밟고 섰는 천사가 하늘을 향하여 오른손을 들고","세세토록 살아계신 자 곧 하늘과 그 가운데 있는 물건이며 땅과 그 가운데 있는 물건이며 바다와 그 가운데 있는 물건을 창조하신 이를 가리켜 맹세하여 가로되 지체하지 아니하리니","일곱째 천사가 소리 내는 날 그 나팔을 불게 될 때에 하나님의 비밀이 그 종 선지자들에게 전하신 복음과 같이 이루리라","하늘에서 나서 내게 들리던 음성이 또 내게 말하여 가로되 네가 가서 바다와 땅을 밟고 섰는 천사의 손에 펴 놓인 책을 가지라 하기로","내가 천사에게 나아가 작은 책을 달라 한즉 천사가 가로되 갖다 먹어버리라 네 배에는 쓰나 네 입에는 꿀 같이 달리라 하거늘","내가 천사의 손에서 작은 책을 갖다 먹어버리니 내 입에는 꿀 같이 다나 먹은 후에 내 배에서는 쓰게 되더라","저가 내게 말하기를 네가 많은 백성과 나라와 방언과 임금에게 다시 예언하여야 하리라 하더라"],
11:["또 내게 지팡이 같은 갈대를 주며 말하기를 일어나서 하나님의 성전과 제단과 그 안에서 경배하는 자들을 척량하되","성전 밖 마당은 척량하지 말고 그냥 두라 이것을 이방인에게 주었은즉 저희가 거룩한 성을 마흔 두 달 동안 짓밟으리라","내가 나의 두 증인에게 권세를 주리니 저희가 굵은 베옷을 입고 일천 이백 육십 일을 예언하리라","이는 이 땅의 주 앞에 섰는 두 감람나무와 두 촛대니","만일 누구든지 저희를 해하고자 한즉 저희 입에서 불이 나서 그 원수를 소멸할지니 누구든지 해하려 하면 반드시 이와 같이 죽임을 당하리라","저희가 권세를 가지고 하늘을 닫아 그 예언을 하는 날 동안 비 오지 못하게 하고 또 권세를 가지고 물을 변하여 피 되게 하고 아무 때든지 원하는 대로 여러가지 재앙으로 땅을 치리로다","저희가 그 증거를 마칠 때에 무저갱으로부터 올라오는 짐승이 저희로 더불어 전쟁을 일으켜 저희를 이기고 저희를 죽일 터인즉","저희 시체가 큰 성 길에 있으리니 그 성은 영적으로 하면 소돔이라고도 하고 애굽이라고도 하니 곧 저희 주께서 십자가에 못 박히신 곳이니라","백성들과 족속과 방언과 나라 중에서 사람들이 그 시체를 사흘 반 동안을 목도하며 무덤에 장사하지 못하게 하리로다","이 두 선지자가 땅에 거하는 자들을 괴롭게 한고로 땅에 거하는 자들이 저희의 죽음을 즐거워하고 기뻐하여 서로 예물을 보내리라 하더라","삼일 반 후에 하나님께로부터 생기가 저희 속에 들어가매 저희 발로 일어서니 구경하는 자들이 크게 두려워하더라","하늘로부터 큰 음성이 있어 이리로 올라오라 함을 저희가 듣고 구름을 타고 하늘로 올라가니 저희 원수들도 구경하더라","그 시에 큰 지진이 나서 성 십분의 일이 무너지고 지진에 죽은 사람이 칠천이라 그 남은 자들이 두려워하여 영광을 하늘의 하나님께 돌리더라","둘째 화는 지나갔으나 보라 세째 화가 속히 이르는도다","일곱째 천사가 나팔을 불매 하늘에 큰 음성들이 나서 가로되 세상 나라가 우리 주와 그 그리스도의 나라가 되어 그가 세세토록 왕노릇 하시리로다 하니","하나님 앞에 자기 보좌에 앉은 이십 사 장로들이 엎드려 얼굴을 대고 하나님께 경배하여","가로되 감사하옵나니 옛적에도 계셨고 시방도 계신 주 하나님 곧 전능하신 이시여 친히 큰 권능을 잡으시고 왕노릇 하시도다","이방들이 분노하매 주의 진노가 임하여 죽은 자를 심판하시며 종 선지자들과 성도들과 또 무론대소하고 주의 이름을 경외하는 자들에게 상 주시며 또 땅을 망하게 하는 자들을 멸망시키실 때로소이다 하더라","이에 하늘에 있는 하나님의 성전이 열리니 성전 안에 하나님의 언약궤가 보이며 또 번개와 음성들과 뇌성과 지진과 큰 우박이 있더라"],
12:["하늘에 큰 이적이 보이니 해를 입은 한 여자가 있는데 그 발 아래는 달이 있고 그 머리에는 열두 별의 면류관을 썼더라","이 여자가 아이를 배어 해산하게 되매 아파서 애써 부르짖더라","하늘에 또 다른 이적이 보이니 보라 한 큰 붉은 용이 있어 머리가 일곱이요 뿔이 열이라 그 여러 머리에 일곱 면류관이 있는데","그 꼬리가 하늘 별 삼분의 일을 끌어다가 땅에 던지더라 용이 해산하려는 여자 앞에서 그가 해산하면 그 아이를 삼키고자 하더니","여자가 아들을 낳으니 이는 장차 철장으로 만국을 다스릴 남자라 그 아이를 하나님 앞과 그 보좌 앞으로 올려가더라","그 여자가 광야로 도망하매 거기서 일천 이백 육십 일 동안 저를 양육하기 위하여 하나님의 예비하신 곳이 있더라","하늘에 전쟁이 있으니 미가엘과 그의 사자들이 용으로 더불어 싸울새 용과 그의 사자들도 싸우나","이기지 못하여 다시 하늘에서 저희의 있을 곳을 얻지 못한지라","큰 용이 내어쫓기니 옛 뱀 곧 마귀라고도 하고 사단이라고도 하는 온 천하를 꾀는 자라 땅으로 내어쫓기니 그의 사자들도 저와 함께 내어 쫓기니라","내가 또 들으니 하늘에 큰 음성이 있어 가로되 이제 우리 하나님의 구원과 능력과 나라와 또 그의 그리스도의 권세가 이루었으니 우리 형제들을 참소하던 자 곧 우리 하나님 앞에서 밤낮 참소하던 자가 쫓겨났고","또 여러 형제가 어린 양의 피와 자기의 증거하는 말을 인하여 저를 이기었으니 그들은 죽기까지 자기 생명을 아끼지 아니하였도다","그러므로 하늘과 그 가운데 거하는 자들은 즐거워하라 그러나 땅과 바다는 화 있을진저 이는 마귀가 자기의 때가 얼마 못된 줄을 알므로 크게 분내어 너희에게 내려갔음이라 하더라","용이 자기가 땅으로 내어쫓긴 것을 보고 남자를 낳은 여자를 핍박하는지라","그 여자가 큰 독수리의 두 날개를 받아 광야 자기 곳으로 날아가 거기서 그 뱀의 낯을 피하여 한 때와 두 때와 반 때를 양육 받으매","여자의 뒤에서 뱀이 그 입으로 물을 강 같이 토하여 여자를 물에 떠내려 가게 하려 하되","땅이 여자를 도와 그 입을 벌려 용의 입에서 토한 강물을 삼키니","용이 여자에게 분노하여 돌아가서 그 여자의 남은 자손 곧 하나님의 계명을 지키며 예수의 증거를 가진 자들로 더불어 싸우려고 바다 모래 위에 섰더라"],
13:["내가 보니 바다에서 한 짐승이 나오는데 뿔이 열이요 머리가 일곱이라 그 뿔에는 열 면류관이 있고 그 머리들에는 참람된 이름들이 있더라","내가 본 짐승은 표범과 비슷하고 그 발은 곰의 발 같고 그 입은 사자의 입 같은데 용이 자기의 능력과 보좌와 큰 권세를 그에게 주었더라","그의 머리 하나가 상하여 죽게 된 것 같더니 그 죽게 되었던 상처가 나으매 온 땅이 이상히 여겨 짐승을 따르고","용이 짐승에게 권세를 주므로 용에게 경배하며 짐승에게 경배하여 가로되 누가 이 짐승과 같으뇨 누가 능히 이로 더불어 싸우리요 하더라","또 짐승이 큰 말과 참람된 말 하는 입을 받고 또 마흔 두 달 일할 권세를 받으니라","짐승이 입을 벌려 하나님을 향하여 훼방하되 그의 이름과 그의 장막 곧 하늘에 거하는 자들을 훼방하더라","또 권세를 받아 성도들과 싸워 이기게 되고 각 족속과 백성과 방언과 나라를 다스리는 권세를 받으니","죽임을 당한 어린 양의 생명책에 창세 이후로 녹명되지 못하고 이 땅에 사는 자들은 다 짐승에게 경배하리라","누구든지 귀가 있거든 들을지어다","사로잡는 자는 사로잡힐 것이요 칼로 죽이는 자는 자기도 마땅히 칼에 죽으리니 성도들의 인내와 믿음이 여기 있느니라","내가 보매 또 다른 짐승이 땅에서 올라오니 새끼 양 같이 두 뿔이 있고 용처럼 말하더라","저가 먼저 나온 짐승의 모든 권세를 그 앞에서 행하고 땅과 땅에 거하는 자들로 처음 짐승에게 경배하게 하니 곧 죽게 되었던 상처가 나은 자니라","큰 이적을 행하되 심지어 사람들 앞에서 불이 하늘로부터 땅에 내려오게 하고","짐승 앞에서 받은 바 이적을 행함으로 땅에 거하는 자들을 미혹하며 땅에 거하는 자들에게 이르기를 칼에 상하였다가 살아난 짐승을 위하여 우상을 만들라 하더라","저가 권세를 받아 그 짐승의 우상에게 생기를 주어 그 짐승의 우상으로 말하게 하고 또 짐승의 우상에게 경배하지 아니하는 자는 몇이든지 다 죽이게 하더라","저가 모든 자 곧 작은 자나 큰 자나 부자나 빈궁한 자나 자유한 자나 종들로 그 오른손에나 이마에 표를 받게 하고","누구든지 이 표를 가진 자 외에는 매매를 못하게 하니 이 표는 곧 짐승의 이름이나 그 이름의 수라","지혜가 여기 있으니 총명 있는 자는 그 짐승의 수를 세어 보라 그 수는 사람의 수니 육백 육십 육이니라"],
14:["또 내가 보니 보라 어린 양이 시온산에 섰고 그와 함께 십 사만 사천이 섰는데 그 이마에 어린 양의 이름과 그 아버지의 이름을 쓴 것이 있도다","내가 하늘에서 나는 소리를 들으니 많은 물소리도 같고 큰 뇌성도 같은데 내게 들리는 소리는 거문고 타는 자들의 그 거문고 타는 것 같더라","저희가 보좌와 네 생물과 장로들 앞에서 새 노래를 부르니 땅에서 구속함을 얻은 십 사만 사천 인 밖에는 능히 이 노래를 배울 자가 없더라","이 사람들은 여자로 더불어 더럽히지 아니하고 정절이 있는 자라 어린 양이 어디로 인도하든지 따라가는 자며 사람 가운데서 구속을 받아 처음 익은 열매로 하나님과 어린 양에게 속한 자들이니","그 입에 거짓말이 없고 흠이 없는 자들이더라","또 보니 다른 천사가 공중에 날아가는데 땅에 거하는 자들 곧 여러 나라와 족속과 방언과 백성에게 전할 영원한 복음을 가졌더라","그가 큰 음성으로 가로되 하나님을 두려워하며 그에게 영광을 돌리라 이는 그의 심판하실 시간이 이르렀음이니 하늘과 땅과 바다와 물들의 근원을 만드신 이를 경배하라 하더라","또 다른 천사 곧 둘째가 그 뒤를 따라 말하되 무너졌도다 무너졌도다 큰 성 바벨론이여 모든 나라를 그 음행으로 인하여 진노의 포도주로 먹이던 자로다 하더라","또 다른 천사 곧 세째가 그 뒤를 따라 큰 음성으로 가로되 만일 누구든지 짐승과 그의 우상에게 경배하고 이마에나 손에 표를 받으면","그도 하나님의 진노의 포도주를 마시리니 그 진노의 잔에 섞인 것이 없이 부은 포도주라 거룩한 천사들 앞과 어린 양 앞에서 불과 유황으로 고난을 받으리니","그 고난의 연기가 세세토록 올라가리로다 짐승과 그의 우상에게 경배하고 그 이름의 표를 받는 자는 누구든지 밤낮 쉼을 얻지 못하리라 하더라","성도들의 인내가 여기 있나니 저희는 하나님의 계명과 예수 믿음을 지키는 자니라","또 내가 들으니 하늘에서 음성이 나서 가로되 기록하라 자금 이후로 주 안에서 죽는 자들은 복이 있도다 하시매 성령이 가라사대 그러하다 저희 수고를 그치고 쉬리니 이는 저희의 행한 일이 따름이라 하시더라","또 내가 보니 흰 구름이 있고 구름 위에 사람의 아들과 같은 이가 앉았는데 그 머리에는 금 면류관이 있고 그 손에는 이한 낫을 가졌더라","또 다른 천사가 성전으로부터 나와 구름 위에 앉은 이를 향하여 큰 음성으로 외쳐 가로되 네 낫을 휘둘러 거두라 거둘 때가 이르러 땅에 곡식이 다 익었음이니이다 하니","구름 위에 앉으신 이가 낫을 땅에 휘두르매 곡식이 거두어지니라","또 다른 천사가 하늘에 있는 성전에서 나오는데 또한 이한 낫을 가졌더라","또 불을 다스리는 다른 천사가 제단으로부터 나와 이한 낫 가진 자를 향하여 큰 음성으로 불러 가로되 네 이한 낫을 휘둘러 땅의 포도송이를 거두라 그 포도가 익었느니라 하더라","천사가 낫을 땅에 휘둘러 땅의 포도를 거두어 하나님의 진노의 큰 포도주 틀에 던지매","성 밖에서 그 틀이 밟히니 틀에서 피가 나서 말굴레까지 닿았고 일천 육백 스다디온에 퍼졌더라"],
15:["또 하늘에 크고 이상한 다른 이적을 보매 일곱 천사가 일곱 재앙을 가졌으니 곧 마지막 재앙이라 하나님의 진노가 이것으로 마치리로다","또 내가 보니 불이 섞인 유리 바다 같은 것이 있고 짐승과 그의 우상과 그의 이름의 수를 이기고 벗어난 자들이 유리 바다 가에 서서 하나님의 거문고를 가지고","하나님의 종 모세의 노래, 어린 양의 노래를 불러 가로되 주 하나님 곧 전능하신 이시여 하시는 일이 크고 기이하시도다 만국의 왕이시여 주의 길이 의롭고 참되시도다","주여 누가 주의 이름을 두려워하지 아니하며 영화롭게 하지 아니하오리이까 오직 주만 거룩하시니이다 주의 의로우신 일이 나타났으매 만국이 와서 주께 경배하리이다 하더라","또 이 일 후에 내가 보니 하늘에 증거 장막의 성전이 열리며","일곱 재앙을 가진 일곱 천사가 성전으로부터 나와 맑고 빛난 세마포 옷을 입고 가슴에 금띠를 띠고","네 생물 중에 하나가 세세에 계신 하나님의 진노를 가득히 담은 금대접 일곱을 그 일곱 천사에게 주니","하나님의 영광과 능력을 인하여 성전에 연기가 차게 되매 일곱 천사의 일곱 재앙이 마치기까지는 성전에 능히 들어갈 자가 없더라"],
16:["또 내가 들으니 성전에서 큰 음성이 나서 일곱 천사에게 말하되 너희는 가서 하나님의 진노의 일곱 대접을 땅에 쏟으라 하더라","첫째가 가서 그 대접을 땅에 쏟으매 악하고 독한 헌데가 짐승의 표를 받은 사람들과 그 우상에게 경배하는 자들에게 나더라","둘째가 그 대접을 바다에 쏟으매 바다가 곧 죽은 자의 피 같이 되니 바다 가운데 모든 생물이 죽더라","세째가 그 대접을 강과 물 근원에 쏟으매 피가 되더라","내가 들으니 물을 차지한 천사가 가로되 전에도 계셨고 시방도 계신 거룩하신 이여 이렇게 심판하시니 의로우시도다","저희가 성도들과 선지자들의 피를 흘렸으므로 저희로 피를 마시게 하신 것이 합당하니이다 하더라","또 내가 들으니 제단이 말하기를 그러하다 주 하나님 곧 전능하신 이시여 심판하시는 것이 참되시고 의로우시도다 하더라","네째가 그 대접을 해에 쏟으매 해가 권세를 받아 불로 사람들을 태우니","사람들이 크게 태움에 태워진지라 이 재앙들을 행하는 권세를 가지신 하나님의 이름을 훼방하며 또 회개하여 영광을 주께 돌리지 아니하더라","또 다섯째가 그 대접을 짐승의 보좌에 쏟으니 그 나라가 곧 어두워지며 사람들이 아파서 자기 혀를 깨물고","아픈 것과 종기로 인하여 하늘의 하나님을 훼방하고 저희 행위를 회개치 아니하더라","또 여섯째가 그 대접을 큰 강 유브라데에 쏟으매 강물이 말라서 동방에서 오는 왕들의 길이 예비되더라","또 내가 보매 개구리 같은 세 더러운 영이 용의 입과 짐승의 입과 거짓 선지자의 입에서 나오니","저희는 귀신의 영이라 이적을 행하여 온 천하 임금들에게 가서 하나님 곧 전능하신 이의 큰 날에 전쟁을 위하여 그들을 모으더라","보라 내가 도적 같이 오리니 누구든지 깨어 자기 옷을 지켜 벌거벗고 다니지 아니하며 자기의 부끄러움을 보이지 아니하는 자가 복이 있도다","세 영이 히브리 음으로 아마겟돈이라 하는 곳으로 왕들을 모으더라","일곱째가 그 대접을 공기 가운데 쏟으매 큰 음성이 성전에서 보좌로부터 나서 가로되 되었다 하니","번개와 음성들과 뇌성이 있고 또 지진이 있어 어찌 큰지 사람이 땅에 있어 옴으로 이같이 큰 지진이 없었더라","큰 성이 세 갈래로 갈라지고 만국의 성들도 무너지니 큰 성 바벨론이 하나님 앞에 기억하신 바 되어 그의 맹렬한 진노의 포도주 잔을 받으매","각 섬도 없어지고 산악도 간 데 없더라","또 중수가 한 달란트나 되는 큰 우박이 하늘로부터 사람들에게 내리매 사람들이 그 박재로 인하여 하나님을 훼방하니 그 재앙이 심히 큼이러라"],
17:["또 일곱 대접을 가진 일곱 천사 중 하나가 와서 내게 말하여 가로되 이리 오라 많은 물 위에 앉은 큰 음녀의 받을 심판을 네게 보이리라","땅의 임금들도 그로 더불어 음행하였고 땅에 거하는 자들도 그 음행의 포도주에 취하였다 하고","곧 성령으로 나를 데리고 광야로 가니라 내가 보니 여자가 붉은 빛 짐승을 탔는데 그 짐승의 몸에 참람된 이름들이 가득하고 일곱 머리와 열 뿔이 있으며","그 여자는 자주빛과 붉은빛 옷을 입고 금과 보석과 진주로 꾸미고 손에 금잔을 가졌는데 가증한 물건과 그의 음행의 더러운 것들이 가득하더라","그 이마에 이름이 기록되었으니 비밀이라, 큰 바벨론이라, 땅의 음녀들과 가증한 것들의 어미라 하였더라","또 내가 보매 이 여자가 성도들의 피와 예수의 증인들의 피에 취한지라 내가 그 여자를 보고 기이히 여기고 크게 기이히 여기니","천사가 가로되 왜 기이히 여기느냐 내가 여자와 그의 탄 바 일곱 머리와 열 뿔 가진 짐승의 비밀을 네게 이르리라","네가 본 짐승은 전에 있었다가 시방 없으나 장차 무저갱으로부터 올라와 멸망으로 들어갈 자니 땅에 거하는 자들로서 창세 이후로 생명책에 녹명되지 못한 자들이 이전에 있었다가 시방 없으나 장차 나올 짐승을 보고 기이히 여기리라","지혜 있는 뜻이 여기 있으니 그 일곱 머리는 여자가 앉은 일곱 산이요","또 일곱 왕이라 다섯은 망하였고 하나는 있고 다른 이는 아직 이르지 아니하였으나 이르면 반드시 잠간 동안 계속하리라","전에 있었다가 시방 없어진 짐승은 여덟째 왕이니 일곱 중에 속한 자라 저가 멸망으로 들어가리라","네가 보던 열 뿔은 열 왕이니 아직 나라를 얻지 못하였으나 다만 짐승으로 더불어 임금처럼 권세를 일시 동안 받으리라","저희가 한 뜻을 가지고 자기의 능력과 권세를 짐승에게 주더라","저희가 어린 양으로 더불어 싸우려니와 어린 양은 만주의 주시요 만왕의 왕이시므로 저희를 이기실 터이요 또 그와 함께 있는 자들 곧 부르심을 입고 빼내심을 얻고 진실한 자들은 이기리로다","또 천사가 내게 말하되 네가 본 바 음녀의 앉은 물은 백성과 무리와 열국과 방언들이니라","네가 본 바 이 열 뿔과 짐승이 음녀를 미워하여 망하게 하고 벌거벗게 하고 그 살을 먹고 불로 아주 사르리라","이는 하나님이 자기 뜻대로 할 마음을 저희에게 주사 한 뜻을 이루게 하시고 저희 나라를 짐승에게 주게 하시되 하나님 말씀이 응하기까지 하심이니라","또 네가 본 그 여자는 땅의 임금들을 다스리는 큰 성이라 하더라"],
18:["이 일 후에 다른 천사가 하늘에서 내려오는 것을 보니 큰 권세를 가졌는데 그의 영광으로 땅이 환하여지더라","힘센 음성으로 외쳐 가로되 무너졌도다 무너졌도다 큰 성 바벨론이여 귀신의 처소와 각종 더러운 영의 모이는 곳과 각종 더럽고 가증한 새의 모이는 곳이 되었도다","그 음행의 진노의 포도주를 인하여 만국이 무너졌으며 또 땅의 왕들이 그로 더불어 음행하였으며 땅의 상고들도 그 사치의 세력을 인하여 치부하였도다 하더라","또 내가 들으니 하늘로서 다른 음성이 나서 가로되 내 백성아 거기서 나와 그의 죄에 참예하지 말고 그의 받을 재앙들을 받지 말라","그 죄는 하늘에 사무쳤으며 하나님은 그의 불의한 일을 기억하신지라","그가 준 그대로 그에게 주고 그의 행위대로 갑절을 갚아주고 그의 섞은 잔에도 갑절이나 섞어 그에게 주라","그가 어떻게 자기를 영화롭게 하였으며 사치하였든지 그만큼 고난과 애통으로 갚아 주라 그가 마음에 말하기를 나는 여황으로 앉은 자요 과부가 아니라 결단코 애통을 당하지 아니하리라 하니","그러므로 하루 동안에 그 재앙들이 이르리니 곧 사망과 애통과 흉년이라 그가 또한 불에 살라지리니 그를 심판하신 주 하나님은 강하신 자이심이니라","그와 함께 음행하고 사치하던 땅의 왕들이 그 불붙는 연기를 보고 위하여 울고 가슴을 치며","그 고난을 무서워하여 멀리 서서 가로되 화 있도다 화 있도다 큰 성, 견고한 성 바벨론이여 일시간에 네 심판이 이르렀다 하리로다","땅의 상고들이 그를 위하여 울고 애통하는 것은 다시 그 상품을 사는 자가 없음이라","그 상품은 금과 은과 보석과 진주와 세마포와 자주 옷감과 비단과 붉은 옷감이요 각종 향목과 각종 상아 기명이요 값진 나무와 진유와 철과 옥석으로 만든 각종 기명이요","계피와 향료와 향과 향유와 유향과 포도주와 감람유와 고운 밀가루와 밀과 소와 양과 말과 수레와 종들과 사람의 영혼들이라","바벨론아 네 영혼의 탐하던 과실이 네게서 떠났으며 맛있는 것들과 빛난 것들이 다 없어졌으니 사람들이 결코 이것들을 다시 보지 못하리로다","바벨론을 인하여 치부한 이 상품의 상고들이 그 고난을 무서워하여 멀리 서서 울고 애통하여","가로되 화 있도다 화 있도다 큰 성이여 세마포와 자주와 붉은 옷을 입고 금과 보석과 진주로 꾸민 것인데","그러한 부가 일시간에 망하였도다 각 선장과 각처를 다니는 선객들과 선인들과 바다에서 일하는 자들이 멀리 서서","그 불붙는 연기를 보고 외쳐 가로되 이 큰 성과 같은 성이 어디 있느뇨 하며","티끌을 자기 머리에 뿌리고 울고 애통하여 외쳐 가로되 화 있도다 화 있도다 이 큰 성이여 바다에서 배 부리는 모든 자들이 너의 보배로운 상품을 인하여 치부하였더니 일시간에 망하였도다","하늘과 성도들과 사도들과 선지자들아 그를 인하여 즐거워하라 하나님이 너희를 신원하시는 심판을 그에게 하셨음이라 하더라","이에 한 힘 센 천사가 큰 맷돌 같은 돌을 들어 바다에 던져 가로되 큰 성 바벨론이 이같이 몹시 떨어져 결코 다시 보이지 아니하리로다","또 거문고 타는 자와 풍류하는 자와 퉁소 부는 자와 나팔 부는 자들의 소리가 결코 다시 네 가운데서 들리지 아니하고 물론 어떠한 세공업자든지 결코 다시 네 가운데서 보이지 아니하고 또 맷돌 소리가 결코 다시 네 가운데서 들리지 아니하고","등불 빛이 결코 다시 네 가운데서 비취지 아니하고 신랑과 신부의 음성이 결코 다시 네 가운데서 들리지 아니하리로다 너의 상고들은 땅의 왕족들이라 네 복술을 인하여 만국이 미혹되었도다","선지자들과 성도들과 및 땅 위에서 죽임을 당한 모든 자의 피가 이 성 중에서 보였느니라 하더라"],
19:["이 일 후에 내가 들으니 하늘에 허다한 무리의 큰 음성 같은 것이 있어 가로되 할렐루야 구원과 영광과 능력이 우리 하나님께 있도다","그의 심판은 참되고 의로운지라 음행으로 땅을 더럽게 한 큰 음녀를 심판하사 자기 종들의 피를 그의 손에 갚으셨도다 하고","두번째 가로되 할렐루야 하더니 그 연기가 세세토록 올라가더라","또 이십 사 장로와 네 생물이 엎드려 보좌에 앉으신 하나님께 경배하여 가로되 아멘 할렐루야 하니","보좌에서 음성이 나서 가로되 하나님의 종들 곧 그를 경외하는 너희들아 무론대소하고 다 우리 하나님께 찬송하라","또 내가 들으니 허다한 무리의 음성도 같고 많은 물소리도 같고 큰 뇌성도 같아서 가로되 할렐루야 주 우리 하나님 곧 전능하신 이가 통치하시도다","우리가 즐거워하고 크게 기뻐하여 그에게 영광을 돌리세 어린 양의 혼인 기약이 이르렀고 그 아내가 예비하였으니","그에게 허락하사 빛나고 깨끗한 세마포를 입게 하셨은즉 이 세마포는 성도들의 옳은 행실이로다 하더라","천사가 내게 말하기를 기록하라 어린 양의 혼인 잔치에 청함을 입은 자들이 복이 있도다 하고 또 내게 말하되 이것은 하나님의 참되신 말씀이라 하기로","내가 그 발 앞에 엎드려 경배하려 하니 그가 나더러 말하기를 나는 너와 및 예수의 증거를 받은 네 형제들과 같이 된 종이니 삼가 그리하지 말고 오직 하나님께 경배하라 예수의 증거는 대언의 영이라 하더라","또 내가 하늘이 열린 것을 보니 보라 백마와 탄 자가 있으니 그 이름은 충신과 진실이라 그가 공의로 심판하며 싸우더라","그 눈이 불꽃 같고 그 머리에 많은 면류관이 있고 또 이름 쓴 것이 하나가 있으니 자기 밖에 아는 자가 없고","또 그가 피 뿌린 옷을 입었는데 그 이름은 하나님의 말씀이라 칭하더라","하늘에 있는 군대들이 희고 깨끗한 세마포를 입고 백마를 타고 그를 따르더라","그의 입에서 이한 검이 나오니 그것으로 만국을 치겠고 친히 저희를 철장으로 다스리며 또 친히 하나님 곧 전능하신 이의 맹렬한 진노의 포도주 틀을 밟겠고","그 옷과 그 다리에 이름 쓴 것이 있으니 만왕의 왕이요 만주의 주라 하였더라","또 내가 보니 한 천사가 해에 서서 공중에 나는 모든 새를 향하여 큰 음성으로 외쳐 가로되 와서 하나님의 큰 잔치에 모여","왕들의 고기와 장군들의 고기와 장사들의 고기와 말들과 그 탄 자들의 고기와 자유한 자들이나 종들이나 무론대소하고 모든 자의 고기를 먹으라 하더라","또 내가 보매 그 짐승과 땅의 임금들과 그 군대들이 모여 그 말 탄 자와 그의 군대로 더불어 전쟁을 일으키다가","짐승이 잡히고 그 앞에서 이적을 행하던 거짓 선지자도 함께 잡혔으니 이는 짐승의 표를 받고 그의 우상에게 경배하던 자들을 이적으로 미혹하던 자라 이 둘이 산 채로 유황불 붙는 못에 던지우고","그 나머지는 말 탄 자의 입으로 나오는 검에 죽으매 모든 새가 그 고기로 배불리우더라"],
20:["또 내가 보매 천사가 무저갱 열쇠와 큰 쇠사슬을 그 손에 가지고 하늘로서 내려와서","용을 잡으니 곧 옛 뱀이요 마귀요 사단이라 잡아 일천년 동안 결박하여","무저갱에 던져 잠그고 그 위에 인봉하여 천년이 차도록 다시는 만국을 미혹하지 못하게 하였다가 그 후에는 반드시 잠간 놓이리라","또 내가 보좌들을 보니 거기 앉은 자들이 있어 심판하는 권세를 받았더라 또 내가 보니 예수의 증거와 하나님의 말씀을 인하여 목 베임을 받은 자의 영혼들과 또 짐승과 그의 우상에게 경배하지도 아니하고 이마와 손에 그의 표를 받지도 아니한 자들이 살아서 그리스도로 더불어 천년 동안 왕노릇 하니","(그 나머지 죽은 자들은 그 천년이 차기까지 살지 못하더라) 이는 첫째 부활이라","이 첫째 부활에 참예하는 자들은 복이 있고 거룩하도다 둘째 사망이 그들을 다스리는 권세가 없고 도리어 그들이 하나님과 그리스도의 제사장이 되어 천년 동안 그리스도로 더불어 왕노릇 하리라","천년이 차매 사단이 그 옥에서 놓여","나와서 땅의 사방 백성 곧 곡과 마곡을 미혹하고 모아 싸움을 붙이리니 그 수가 바다 모래 같으리라","저희가 지면에 널리 퍼져 성도들의 진과 사랑하시는 성을 두르매 하늘에서 불이 내려와 저희를 소멸하고","또 저희를 미혹하는 마귀가 불과 유황 못에 던지우니 거기는 그 짐승과 거짓 선지자도 있어 세세토록 밤낮 괴로움을 받으리라","또 내가 크고 흰 보좌와 그 위에 앉으신 자를 보니 땅과 하늘이 그 앞에서 피하여 간 데 없더라","또 내가 보니 죽은 자들이 무론대소하고 그 보좌 앞에 섰는데 책들이 펴 있고 또 다른 책이 펴졌으니 곧 생명책이라 죽은 자들이 자기 행위를 따라 책들에 기록된 대로 심판을 받으니","바다가 그 가운데서 죽은 자들을 내어주고 또 사망과 음부도 그 가운데서 죽은 자들을 내어주매 각 사람이 자기의 행위대로 심판을 받고","사망과 음부도 불못에 던지우니 이것은 둘째 사망 곧 불못이라","누구든지 생명책에 기록되지 못한 자는 불못에 던지우더라"],
21:["또 내가 새 하늘과 새 땅을 보니 처음 하늘과 처음 땅이 없어졌고 바다도 다시 있지 않더라","또 내가 보매 거룩한 성 새 예루살렘이 하나님께로부터 하늘에서 내려오니 그 예비한 것이 신부가 남편을 위하여 단장한 것 같더라","내가 들으니 보좌에서 큰 음성이 나서 가로되 보라 하나님의 장막이 사람들과 함께 있으매 하나님이 저희와 함께 거하시리니 저희는 하나님의 백성이 되고 하나님은 친히 저희와 함께 계셔서","모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라","보좌에 앉으신 이가 가라사대 보라 내가 만물을 새롭게 하노라 하시고 또 가라사대 이 말은 신실하고 참되니 기록하라 하시고","또 내게 말씀하시되 이루었도다 나는 알파와 오메가요 처음과 나중이라 내가 생명수 샘물로 목마른 자에게 값 없이 주리니","이기는 자는 이것들을 유업으로 얻으리라 나는 저의 하나님이 되고 그는 내 아들이 되리라","그러나 두려워하는 자들과 믿지 아니하는 자들과 흉악한 자들과 살인자들과 행음자들과 술객들과 우상 숭배자들과 모든 거짓말하는 자들은 불과 유황으로 타는 못에 참예하리니 이것이 둘째 사망이라","일곱 대접을 가지고 마지막 일곱 재앙을 담은 일곱 천사 중 하나가 나아와서 내게 말하여 가로되 이리 오라 내가 신부 곧 어린 양의 아내를 네게 보이리라 하고","성령으로 나를 데리고 크고 높은 산으로 올라가 하나님께로부터 하늘에서 내려오는 거룩한 성 예루살렘을 보이니","하나님의 영광이 있으매 그 성의 빛이 지극히 귀한 보석 같고 벽옥과 수정 같이 맑더라","크고 높은 성곽이 있고 열두 문이 있는데 문에 열두 천사가 있고 그 문들 위에 이름을 썼으니 이스라엘 자손 열두 지파의 이름들이라","동편에 세 문, 북편에 세 문, 남편에 세 문, 서편에 세 문이니","그 성에 성곽은 열두 기초석이 있고 그 위에 어린 양의 십이 사도의 열두 이름이 있더라","내게 말하는 자가 그 성과 그 문들과 성곽을 척량하려고 금 갈대를 가졌더라","그 성은 네모가 반듯하여 장광이 같은지라 그 갈대로 그 성을 척량하니 일만 이천 스다디온이요 장과 광과 고가 같더라","그 성곽을 척량하매 일백 사십 사 규빗이니 사람의 척량 곧 천사의 척량이라","그 성곽은 벽옥으로 쌓였고 그 성은 정금인데 맑은 유리 같더라","그 성의 성곽의 기초석은 각색 보석으로 꾸몄는데 첫째 기초석은 벽옥이요 둘째는 남보석이요 세째는 옥수요 네째는 녹보석이요","다섯째는 홍마노요 여섯째는 홍보석이요 일곱째는 황옥이요 여덟째는 녹옥이요 아홉째는 담황옥이요 열째는 비취옥이요 열 한째는 청옥이요 열 두째는 자정이라","그 열두 문은 열두 진주니 문마다 한 진주요 성의 길은 맑은 유리 같은 정금이더라","성 안에 성전을 내가 보지 못하였으니 이는 주 하나님 곧 전능하신 이와 및 어린 양이 그 성전이심이라","그 성은 해나 달의 비췸이 쓸 데 없으니 이는 하나님의 영광이 비취고 어린 양이 그 등이 되심이라","만국이 그 빛 가운데로 다니고 땅의 왕들이 자기 영광을 가지고 그리로 들어오리라","성문들을 낮에 도무지 닫지 아니하리니 거기는 밤이 없음이라","사람들이 만국의 영광과 존귀를 가지고 그리로 들어오겠고","무엇이든지 속된 것이나 가증한 일 또는 거짓말하는 자는 결코 그리로 들어오지 못하되 오직 어린 양의 생명책에 기록된 자들뿐이라"],
22:["또 저가 수정 같이 맑은 생명수의 강을 내게 보이니 하나님과 및 어린 양의 보좌로부터 나서","길 가운데로 흐르더라 강 좌우에 생명나무가 있어 열두가지 실과를 맺히되 달마다 그 실과를 맺히고 그 나무 잎사귀들은 만국을 소성하기 위하여 있더라","다시 저주가 없으며 하나님과 그 어린 양의 보좌가 그 가운데 있으리니 그의 종들이 그를 섬기며","그의 얼굴을 볼 터이요 그의 이름도 저희 이마에 있으리라","다시 밤이 없겠고 등불과 햇빛이 쓸 데 없으니 이는 주 하나님이 저희에게 비취심이라 저희가 세세토록 왕노릇하리로다","또 그가 내게 말하기를 이 말은 신실하고 참된 자라 주 곧 선지자들의 영의 하나님이 그의 종들에게 결코 속히 될 일을 보이시려고 그의 천사를 보내셨도다","보라 내가 속히 오리니 이 책의 예언의 말씀을 지키는 자가 복이 있으리라 하더라","이것들을 보고 들은 자는 나 요한이니 내가 듣고 볼 때에 이 일을 내게 보이던 천사의 발 앞에 경배하려고 엎드렸더니","저가 내게 말하기를 나는 너와 네 형제 선지자들과 또 이 책의 말을 지키는 자들과 함께 된 종이니 그리하지 말고 오직 하나님께 경배하라 하더라","또 내게 말하되 이 책의 예언의 말씀을 인봉하지 말라 때가 가까우니라","불의를 하는 자는 그대로 불의를 하고 더러운 자는 그대로 더럽고 의로운 자는 그대로 의를 행하고 거룩한 자는 그대로 거룩되게 하라","보라 내가 속히 오리니 내가 줄 상이 내게 있어 각 사람에게 그의 일한 대로 갚아 주리라","나는 알파와 오메가요 처음과 나중이요 시작과 끝이라","그 두루마기를 빠는 자들은 복이 있으니 이는 저희가 생명나무에 나아가며 문들을 통하여 성에 들어갈 권세를 얻으려 함이로다","개들과 술객들과 행음자들과 살인자들과 우상 숭배자들과 및 거짓말을 좋아하며 지어내는 자마다 성 밖에 있으리라","나 예수는 교회들을 위하여 내 사자를 보내어 이것들을 너희에게 증거하게 하였노라 나는 다윗의 뿌리요 자손이니 곧 광명한 새벽별이라 하시더라","성령과 신부가 말씀하시기를 오라 하시는도다 듣는 자도 오라 할 것이요 목마른 자도 올 것이요 또 원하는 자는 값없이 생명수를 받으라 하시더라","내가 이 책의 예언의 말씀을 듣는 각인에게 증거하노니 만일 누구든지 이것들 외에 더하면 하나님이 이 책에 기록된 재앙들을 그에게 더하실 터이요","만일 누구든지 이 책의 예언의 말씀에서 제하여 버리면 하나님이 이 책에 기록된 생명나무와 및 거룩한 성에 참예함을 제하여 버리시리라","이것들을 증거하신 이가 가라사대 내가 진실로 속히 오리라 하시거늘 아멘 주 예수여 오시옵소서","주 예수의 은혜가 모든 자들에게 있을지어다 아멘"]

/* ===================== 상태 관리 ===================== */
const MODE_NAMES = {copy:"따라쓰기", study:"학습 모드", blank:"빈칸채우기", exam:"모의고사"};
const CHAPTERS = Object.keys(BIBLE).map(Number);

let mem = {}; // localStorage 사용 불가 환경 대비
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
};

let state = {
  tab:"quiz", mode:"copy", ch:1,
  opts:{strict:false, shuffle:false, reverse:false, chgrade:false},
  records:{},   // "ch:v:mode" -> {ok:true/false}
  drafts:{},    // "ch:v:mode" -> 입력 중인 답
  wrongs:[],    // {ch, vs, mode, ans}
  revealed:{},  // 학습 모드에서 가린 절
  orders:{},    // 무작위 순서 캐시
  quarter:"all",// 선택된 분기 (q1~q4, all)
  corrections:{},// "ch:v" -> 사용자가 교정한 본문 (localStorage 저장)
  memos:{},     // "ch:v" -> 구절 옆 간단 메모 (localStorage 저장)
  editMode:false,// 본문 교정 모드 on/off (비저장, 새로고침 시 꺼짐)
  _editing:null  // 현재 편집 중인 "ch:v" (비저장)
};

// 원문 스냅샷 (교정 전 원래 본문) — '원문 복원'에 사용
const ORIGINAL = {};
for(const ch of CHAPTERS){ ORIGINAL[ch] = BIBLE[ch].slice(); }

(function load(){
  const saved = store.get("rev_app_v1");
  if(saved){ try{ const s=JSON.parse(saved); Object.assign(state,s); state.orders={}; }catch(e){} }
  state.tab = "quiz";
  state.editMode = false; state._editing = null; // 편집 상태는 항상 초기화
  if(!state.corrections || typeof state.corrections!=="object") state.corrections = {};
  if(!state.memos || typeof state.memos!=="object") state.memos = {};
  applyCorrections(); // 저장된 교정 본문을 BIBLE에 반영
})();
function save(){
  const {tab,mode,ch,opts,records,wrongs,drafts,quarter,corrections,memos} = state;
  store.set("rev_app_v1", JSON.stringify({tab,mode,ch,opts,records,wrongs,drafts,quarter,corrections,memos}));
}
// 저장된 교정 본문을 BIBLE에 적용
function applyCorrections(){
  for(const k in state.corrections){
    const [c,v] = k.split(":").map(Number);
    if(BIBLE[c] && BIBLE[c][v-1]!==undefined) BIBLE[c][v-1] = state.corrections[k];
  }
}

/* ===================== 유틸 ===================== */
function key(ch,v,mode){ return ch+":"+v+":"+mode; }
function norm(s){
  s = (s||"").trim();
  return state.opts.strict ? s.replace(/\s+/g," ") : s.replace(/\s+/g,"");
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffleArr(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function verseOrder(ch){
  let order = BIBLE[ch].map((_,i)=>i+1);
  if(state.opts.shuffle){
    if(!state.orders[ch]) state.orders[ch] = shuffleArr(order);
    order = state.orders[ch];
  }
  if(state.opts.reverse) order = order.slice().reverse();
  return order;
}
function sectionOf(ch,v){
  const secs = SECTIONS[ch]||[];
  for(const [s,e,t] of secs){ if(v===s) return "["+s+"~"+e+"절] "+t; }
  return null;
}
// 단어 단위 비교 표시(정답 기준, 틀린 부분 강조)
function diffMark(correct, user){
  const cw = correct.split(/\s+/), uw = (user||"").trim().split(/\s+/);
  const strip = w => state.opts.strict ? w : w.replace(/\s+/g,"");
  // 공백 무시 모드에서는 통짜 문자열로 위치 매칭이 어려우므로 단어 단위 근사 비교
  return cw.map((w,i)=>{
    const u = uw[i]||"";
    const same = state.opts.strict ? w===u : strip(w)===strip(u) || (norm(correct)===norm(user));
    return same ? esc(w) : "<b>"+esc(w)+"</b>";
  }).join(" ");
}

/* ===================== 채점 ===================== */
function gradeVerse(ch,v,ans){
  const correct = BIBLE[ch][v-1];
  const ok = norm(ans)===norm(correct);
  state.records[key(ch,v,state.mode)] = {ok};
  state.drafts[key(ch,v,state.mode)] = ans;
  const wkey = w => w.ch===ch && w.vs===v && w.mode===state.mode;
  state.wrongs = state.wrongs.filter(w=>!wkey(w));
  if(!ok) state.wrongs.push({ch, vs:v, mode:state.mode, ans});
  save();
  return ok;
}
function checkOne(ch,v){
  const ta = document.getElementById("ta-"+ch+"-"+v);
  if(!ta) return;
  gradeVerse(ch,v,ta.value);
  render();
}
function checkBlank(ch,v){
  const correct = BIBLE[ch][v-1];
  const words = correct.trim().split(/\s+/);
  const inputs = document.querySelectorAll('input[data-bk="'+ch+"-"+v+'"]');
  let all = true, parts = words.slice();
  inputs.forEach(inp=>{
    const idx = +inp.dataset.idx;
    const good = norm(inp.value)===norm(words[idx]);
    inp.classList.toggle("okb", good);
    inp.classList.toggle("badb", !good);
    if(!good) all=false;
    state.drafts[key(ch,v,"blank")+":"+idx] = inp.value;
  });
  state.records[key(ch,v,"blank")] = {ok:all};
  state.wrongs = state.wrongs.filter(w=>!(w.ch===ch&&w.vs===v&&w.mode==="blank"));
  if(!all) state.wrongs.push({ch, vs:v, mode:"blank", ans:"(빈칸 오답)"});
  save();
  updateProgress();
  const res = document.getElementById("res-"+ch+"-"+v);
  if(res){
    res.style.display="block";
    res.className = "result "+(all?"ok":"bad");
    res.innerHTML = all ? "✓ 정답입니다!" :
      '<span class="tag">✗ 틀린 빈칸이 있어요.</span><div class="lbl">정답</div><div class="cmp">'+esc(correct)+"</div>";
  }
}
function gradeChapter(){
  const ch = state.ch;
  verseOrder(ch).forEach(v=>{
    if(state.mode==="blank"){ checkBlank(ch,v); }
    else{
      const ta = document.getElementById("ta-"+ch+"-"+v);
      if(ta) gradeVerse(ch,v,ta.value);
    }
  });
  render();
}

/* ===================== 조작 ===================== */
function setTab(t){ state.tab=t; save(); render(); }
function setMode(m){ state.mode=m; save(); render(); }
function setChapter(c){ state.ch=c; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
const QUARTERS = { q1:[1,6], q2:[7,12], q3:[13,17], q4:[18,22], all:[1,22] };
function setQuarter(q){
  state.quarter = q;
  const r = QUARTERS[q] || QUARTERS.all;
  if(state.ch < r[0] || state.ch > r[1]) state.ch = r[0]; // 현재 장이 범위 밖이면 분기 첫 장으로
  save(); render();
}
function setOpt(){
  state.opts.strict = document.getElementById("opt-strict").checked;
  const sh = document.getElementById("opt-shuffle").checked;
  if(sh && !state.opts.shuffle) state.orders={};
  state.opts.shuffle = sh;
  state.opts.reverse = document.getElementById("opt-reverse").checked;
  state.opts.chgrade = document.getElementById("opt-chgrade").checked;
  save(); render();
}
function resetChapter(){
  if(!confirm(state.ch+"장의 기록을 초기화할까요?")) return;
  const ch = state.ch;
  Object.keys(state.records).forEach(k=>{ if(k.startsWith(ch+":")) delete state.records[k]; });
  Object.keys(state.drafts).forEach(k=>{ if(k.startsWith(ch+":")) delete state.drafts[k]; });
  state.wrongs = state.wrongs.filter(w=>w.ch!==ch);
  delete state.orders[ch];
  save(); render();
}
function toggleReveal(ch,v){
  const k = key(ch,v,"study");
  state.revealed[k] = !state.revealed[k]; // true = 가림
  render();
}
function hideAllStudy(hide){
  BIBLE[state.ch].forEach((_,i)=>{ state.revealed[key(state.ch,i+1,"study")] = hide; });
  render();
}
let __draftTimer = null;
function saveDraft(ch,v){
  const ta = document.getElementById("ta-"+ch+"-"+v);
  if(ta) state.drafts[key(ch,v,state.mode)] = ta.value;
  clearTimeout(__draftTimer);
  __draftTimer = setTimeout(save, 400); // 입력 멈추면 자동 저장
}
function retryWrong(i){
  const w = state.wrongs[i];
  const ta = document.getElementById("wta-"+i);
  if(!w||!ta) return;
  const correct = BIBLE[w.ch][w.vs-1];
  if(norm(ta.value)===norm(correct)){
    state.wrongs.splice(i,1);
    save(); render();
  }else{
    const res = document.getElementById("wres-"+i);
    res.style.display="block";
    res.className="result bad";
    res.innerHTML = '<span class="tag">✗ 아직 달라요.</span><div class="lbl">정답 (틀린 부분 강조)</div><div class="cmp">'+diffMark(correct, ta.value)+"</div>";
  }
}
function removeWrong(i){ state.wrongs.splice(i,1); save(); render(); }

/* ===================== 렌더링 ===================== */
function blanksFor(ch,v){
  // 3단어마다 하나씩 빈칸 (절 번호로 시작 위치를 바꿔 다양화)
  const words = BIBLE[ch][v-1].trim().split(/\s+/);
  const start = v % 3;
  const set = new Set();
  for(let i=start;i<words.length;i+=3) set.add(i);
  if(set.size===0) set.add(0);
  return {words, set};
}

// ===== 엔터로 바로 채점 (구절 끝에 도달했을 때만) =====
function taKey(e,ch,v){
  if(e.key!=="Enter" || e.shiftKey) return;
  if(e.isComposing || e.keyCode===229) return; // 한글 조합 중 엔터는 무시
  if(state.opts.chgrade) return; // 장별 채점 모드에서는 일반 줄바꿈
  const correct = BIBLE[ch][v-1];
  const nT = (e.target.value||"").trim().replace(/\s+/g,"");
  const nC = correct.trim().replace(/\s+/g,"");
  const lastWord = correct.trim().split(/\s+/).pop().replace(/\s+/g,"");
  // 구절 끝 판정: 길이가 정답에 도달했거나, 마지막 단어로 끝나면서 거의 다 쓴 경우
  const atEnd = nT.length>=nC.length || (nT.length>=nC.length*0.8 && nT.slice(-lastWord.length)===lastWord);
  if(!atEnd) return; // 아직 구절 중간이면 그냥 줄바꿈
  e.preventDefault();
  checkOne(ch,v);
  const nx = document.getElementById("ta-"+ch+"-"+(v+1));
  if(nx) nx.focus();
}
function blankKey(e,ch,v){
  if(e.key!=="Enter") return;
  if(e.isComposing || e.keyCode===229) return;
  e.preventDefault();
  if(state.opts.chgrade) return;
  checkBlank(ch,v);
}

// ===== 구절 다시 연습 (개별 리셋) =====
function resetVerse(ch,v){
  const k = key(ch,v,state.mode);
  delete state.records[k];
  delete state.drafts[k];
  Object.keys(state.drafts).forEach(dk=>{ if(dk.indexOf(k+":")===0) delete state.drafts[dk]; });
  save();
  render();
  const ta = document.getElementById("ta-"+ch+"-"+v);
  if(ta) ta.focus();
  else {
    const inp = document.querySelector('input[data-bk="'+ch+'-'+v+'"]');
    if(inp) inp.focus();
  }
}

/* ===================== 본문 교정 ===================== */
function toggleEditMode(){
  state.editMode = !state.editMode;
  state._editing = null;
  render();
}
function startEdit(ch,v){
  state._editing = ch+":"+v;
  render();
  const ta = document.getElementById("edit-"+ch+"-"+v);
  if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function cancelEdit(){ state._editing = null; render(); }
// 구절 옆 메모 저장 (입력 중 focus 유지 위해 render 하지 않음)
function saveMemo(ch,v,val){
  const kk = ch+":"+v;
  if((val||"").trim()==="") delete state.memos[kk];
  else state.memos[kk] = val;
  save();
}
// 교정 저장 시 해당 절의 기존 채점 기록/오답은 정리 (본문이 바뀌었으므로)
function clearVerseRecords(ch,v){
  Object.keys(state.records).forEach(k=>{ if(k.indexOf(ch+":"+v+":")===0) delete state.records[k]; });
  Object.keys(state.drafts).forEach(k=>{ if(k.indexOf(ch+":"+v+":")===0) delete state.drafts[k]; });
  state.wrongs = state.wrongs.filter(w=>!(w.ch===ch && w.vs===v));
}
function saveEdit(ch,v){
  const ta = document.getElementById("edit-"+ch+"-"+v);
  if(!ta) return;
  // 엔터로 넣은 줄바꿈은 그대로 보존. 각 줄 안의 공백/탭만 한 칸으로 정리.
  const val = ta.value
    .replace(/\r\n?/g,"\n")                 // 개행 문자 통일
    .split("\n")
    .map(line => line.replace(/[ \t]+/g," ").trim())  // 줄 안의 여분 공백만 정리
    .join("\n")
    .replace(/\n{3,}/g,"\n\n")              // 빈 줄은 최대 1줄까지만
    .replace(/^\n+|\n+$/g,"");              // 앞뒤 빈 줄 제거
  if(!val){ alert("본문이 비어 있습니다."); return; }
  const kk = ch+":"+v;
  if(val === ORIGINAL[ch][v-1]){
    delete state.corrections[kk]; // 원문과 같아지면 교정 해제
  } else {
    state.corrections[kk] = val;
  }
  BIBLE[ch][v-1] = val;
  clearVerseRecords(ch,v);
  state._editing = null;
  save(); render();
}
function revertVerse(ch,v){
  const kk = ch+":"+v;
  if(!state.corrections[kk]) return;
  if(!confirm("계 "+ch+":"+v+" 을 원문으로 되돌릴까요?")) return;
  delete state.corrections[kk];
  BIBLE[ch][v-1] = ORIGINAL[ch][v-1];
  clearVerseRecords(ch,v);
  state._editing = null;
  save(); render();
}

    if(state.mode==="copy"){
      html += '<div class="vtext">'+esc(correct)+'</div>';
      html += '<textarea class="ans" id="ta-'+ch+'-'+v+'" placeholder="위 성구를 따라 쓰세요..." oninput="saveDraft('+ch+','+v+')" onkeydown="taKey(event,'+ch+','+v+')">'+esc(draft)+'</textarea>';
    }
    else if(state.mode==="exam"){
      html += '<textarea class="ans" id="ta-'+ch+'-'+v+'" placeholder="성구를 암송하여 쓰세요..." oninput="saveDraft('+ch+','+v+')" onkeydown="taKey(event,'+ch+','+v+')">'+esc(draft)+'</textarea>';
    }
    else if(state.mode==="blank"){
      const {words,set} = blanksFor(ch,v);
      html += '<div class="blankline">'+ words.map((w,i)=>{
        if(set.has(i)){
          const dv = state.drafts[k+":"+i]||"";
          return '<input class="blank" data-bk="'+ch+'-'+v+'" data-idx="'+i+'" style="width:'+Math.max(w.length*1.15+1.5,3)+'ch" value="'+esc(dv)+'" onkeydown="blankKey(event,'+ch+','+v+')">';
        }
        return esc(w);
      }).join(" ") +'</div>';
    }

    // 채점 결과
    html += '<div class="result" id="res-'+ch+'-'+v+'" style="display:'+(rec?'block':'none')+'"></div>';

    if(!state.opts.chgrade){
      const fn = state.mode==="blank" ? "checkBlank" : "checkOne";
      html += '<button class="checkbtn" onclick="'+fn+'('+ch+','+v+')">확인</button>';
      html += '<button class="retrybtn" onclick="resetVerse('+ch+','+v+')">↺ 다시 연습</button>';
    } else {
      html += '<button class="retrybtn" onclick="resetVerse('+ch+','+v+')">↺ 다시 연습</button>';
    }
  });

  if(state.opts.chgrade && state.mode!=="study" && !state.editMode){
    html += '<button class="checkbtn bigcheck" onclick="gradeChapter()">이 장 전체 채점하기</button>';
  }
  html += '</div>';
  document.getElementById("content").innerHTML = html;
  order.forEach(v=>{
    const rec = state.records[key(ch,v,state.mode)];
    const res = document.getElementById("res-"+ch+"-"+v);
    if(!rec||!res) return;
    res.className = "result "+(rec.ok?"ok":"bad");
    if(rec.ok){ res.innerHTML = "✓ 정답입니다!"; }
    else{
      const correct = BIBLE[ch][v-1];
      const ans = state.drafts[key(ch,v,state.mode)]||"";
      res.innerHTML = '<span class="tag">✗ 아쉬워요, 다시 확인해 보세요.</span>'+
        '<div class="lbl">정답 (틀린 부분 강조)</div><div class="cmp">'+diffMark(correct, ans)+'</div>';
    }
    if(state.mode==="blank"){
      const inputs = document.querySelectorAll('input[data-bk="'+ch+'-'+v+'"]');
      const words = BIBLE[ch][v-1].trim().split(/\s+/);
      inputs.forEach(inp=>{
        const good = norm(inp.value)===norm(words[+inp.dataset.idx]);
        inp.classList.toggle("okb", good && inp.value!=="");
        inp.classList.toggle("badb", !good);
      });
    }
  });
}

function renderWrong(){
  if(state.wrongs.length===0){
    document.getElementById("content").innerHTML =
      '<div class="empty">🎉 오답 노트가 비어 있어요.<br>퀴즈에서 틀린 성구가 이곳에 모입니다.</div>';
    return;
  }
  let html = "";
  state.wrongs.forEach((w,i)=>{
    const correct = BIBLE[w.ch][w.vs-1];
    html += '<div class="wrongitem">';
    html += '<div class="ref">계 '+w.ch+'장 '+w.vs+'절 <button class="rmbtn" onclick="removeWrong('+i+')">삭제</button></div>';
    html += '<div class="meta">'+MODE_NAMES[w.mode]+'에서 틀림</div>';
    html += '<div class="lbl" style="color:var(--sub);font-size:13.5px;margin-bottom:4px;">내가 쓴 답</div>';
    html += '<div class="myans">'+(esc(w.ans)||"(입력 없음)")+'</div>';
    html += '<div class="lbl" style="color:var(--sub);font-size:13.5px;margin:10px 0 4px;">정답</div>';
    html += '<div class="vtext">'+esc(correct)+'</div>';
    html += '<textarea class="ans" id="wta-'+i+'" placeholder="다시 한번 따라 써 보세요... 정답이면 오답 노트에서 사라져요."></textarea>';
    html += '<div class="result" id="wres-'+i+'" style="display:none"></div>';
    html += '<button class="checkbtn" onclick="retryWrong('+i+')">확인</button>';
    html += '</div>';
  });
  document.getElementById("content").innerHTML = html;
}

function updateProgress(){}

function render(){
  // 탭 / 모드 버튼
  ["copy","study","blank","exam"].forEach(m=>{
    document.getElementById("mode-"+m).classList.toggle("on", state.mode===m);
  });

  // 옵션 체크박스 동기화
  document.getElementById("opt-strict").checked = state.opts.strict;
  document.getElementById("opt-shuffle").checked = state.opts.shuffle;
  document.getElementById("opt-reverse").checked = state.opts.reverse;
  document.getElementById("opt-chgrade").checked = state.opts.chgrade;

  // 분기 버튼
  if(!QUARTERS[state.quarter]) state.quarter="all";
  const qlabels = { q1:"1분기 (1~6장)", q2:"2분기 (7~12장)", q3:"3분기 (13~17장)", q4:"4분기 (18~22장)", all:"전체장" };
  const qbtns = ["all","q1","q2","q3","q4"].map(q=>
    '<button class="qbtn'+(state.quarter===q?' on':'')+'" onclick="setQuarter(\''+q+'\')">'+qlabels[q]+'</button>'
  ).join("");
  document.getElementById("quarters").innerHTML = qbtns;

  // 장 버튼 (선택된 분기만 표시)
  const range = QUARTERS[state.quarter];
  const chips = CHAPTERS.filter(c=>c>=range[0]&&c<=range[1]).map(c=>{
    // 장 완료 표시
    let done=false;
    if(state.tab==="quiz" && state.mode!=="study"){
      done = BIBLE[c].every((_,i)=>{ const r=state.records[key(c,i+1,state.mode)]; return r&&r.ok; });
    }
    return '<button class="chip'+(c===state.ch?' on':'')+'" onclick="setChapter('+c+')">'+c+'장'+(done?' ✓':'')+'</button>';
  }).join("");
  document.getElementById("chips").innerHTML = chips;

  renderQuiz();
  updateProgress();
}

render();

// ===== 마지막 위치 저장 / 복원 =====
function savePos(){
  store.set("rev_last_pos", JSON.stringify({ch:state.ch, mode:state.mode, y:window.scrollY}));
}
let __posTimer = null;
window.addEventListener("scroll", ()=>{
  clearTimeout(__posTimer);
  __posTimer = setTimeout(savePos, 200);
});
window.addEventListener("beforeunload", savePos);
window.addEventListener("pagehide", savePos);

(function restorePos(){
  try{
    const p = JSON.parse(store.get("rev_last_pos")||"null");
    if(p && p.ch===state.ch && p.mode===state.mode && p.y>0){
      setTimeout(()=>window.scrollTo({top:p.y}), 60);
    }
  }catch(e){}
})();
</script>
</body>
